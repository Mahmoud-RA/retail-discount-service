services:
  mongo:
    image: mongo:7.0
    container_name: retail-discount-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_password_123}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-retail_app_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-retail_app_password_123}
      MONGO_DATABASE: ${MONGO_DATABASE:-retail_discount_db}
    volumes:
      - mongo_data:/data/db
      - ./db/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    networks:
      retail-discount-network:
        aliases:
          - mongo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u ${MONGO_ROOT_USERNAME:-root} -p ${MONGO_ROOT_PASSWORD:-root_password_123} --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: retail-discount-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_discount_audit}
      POSTGRES_USER: ${POSTGRES_USER:-retail_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-postgres.sql:/docker-entrypoint-initdb.d/01-init-postgres.sql:ro
    networks:
      retail-discount-network:
        aliases:
          - postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-retail_user} -d ${POSTGRES_DB:-retail_discount_audit}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail-discount-service
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SERVER_PORT: 8080

      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-retail_app_user}:${MONGO_APP_PASSWORD:-retail_app_password_123}@mongo:27017/${MONGO_DATABASE:-retail_discount_db}?authSource=${MONGO_DATABASE:-retail_discount_db}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retail_discount_audit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-retail_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-retail_password_123}

      APP_CLIENT_ID: ${APP_CLIENT_ID:-retail-app-v1}
      APP_CLIENT_SECRET: ${APP_CLIENT_SECRET:-super-secret-key-789}
    networks:
      - retail-discount-network

volumes:
  mongo_data:
  postgres_data:

networks:
  retail-discount-network:
    driver: bridge